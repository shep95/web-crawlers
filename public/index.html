<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Omnispider — Metadata Intelligence</title>
    <meta name="description" content="Search public sources and inspect evidence-backed metadata across 41 categories." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="top">
      <a class="brand" href="/" data-link>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5M4.9 4.9l3.5 3.5M15.6 15.6l3.5 3.5M4.9 19.1l3.5-3.5M15.6 8.4l3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>Omnispider</span>
      </a>
      <form class="search" id="search-form" role="search">
        <label class="sr" for="q">Search, or paste a URL / DOI</label>
        <input id="q" name="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search topics, or paste a URL, DOI or arXiv id" maxlength="500" />
        <button type="submit">Search</button>
      </form>
      <nav class="nav" aria-label="Main">
        <a href="/crawl" data-link>Crawl</a>
        <a href="/categories" data-link>41 categories</a>
        <a href="/status" data-link>Status</a>
      </nav>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="foot">
      <span>Stateless: nothing you search or analyze is stored. Respects robots.txt.</span>
      <a href="/api/v2/info" target="_blank" rel="noopener">API</a>
    </footer>
    <script src="/app.js" type="module"></script>
  </body>
</html>
