name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Runs every corpus test against Postgres as well as SQLite.
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Tests (SQLite + Postgres; browser-rendering test runs when Chromium is present)
        run: npm test
      - name: SSRF guard smoke test
        run: node --input-type=module -e "import { checkUrl } from './dist/net/ip-guard.js'; if (checkUrl('http://169.254.169.254/latest').ok) process.exit(1);"
