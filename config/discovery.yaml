# Operator-managed bootstrap seeds for the autonomous crawler.
# These are discovery inputs maintained by the system operator — end users never
# supply URLs. Sitemaps and feeds are re-fetched on their interval; everything
# they reference is retrieved, inspected and indexed by the crawler.
seeds:
  - { id: datagov_sitemap, url: "https://catalog.data.gov/sitemap.xml", type: sitemap, interval_hours: 24, priority: 55 }
  - { id: ukdata_sitemap, url: "https://www.data.gov.uk/sitemap.xml", type: sitemap, interval_hours: 24, priority: 55 }
  - { id: eurostat_feed, url: "https://ec.europa.eu/eurostat/en/web/main/news/euro-indicators/rss", type: feed, interval_hours: 12, priority: 55 }
  - { id: nasa_feed, url: "https://www.nasa.gov/feed/", type: feed, interval_hours: 12, priority: 50 }
  - { id: w3c_feed, url: "https://www.w3.org/news/feed/", type: feed, interval_hours: 24, priority: 45 }
  - { id: schemaorg, url: "https://schema.org/docs/full.html", type: page, interval_hours: 168, priority: 40 }

# Common Crawl index sampling for standalone files (no webpage required).
# Diversity-first rotation (src/corpus/rotation.ts): each run issues `pairs_per_run`
# bounded queries (25 records each) for the next rotation slots — all 248 IANA ccTLDs
# interleaved by continent, every other IANA TLD, every national language (filtered via
# Common Crawl's ISO 639-3 `languages` field), and every parser-backed MIME family from
# the format registry. `per_host` caps items per host per run. Optional `domains` are
# operator pins that take turns with rotation slots; leave `mimes` unset to rotate MIME
# families from the registry. Per-run coverage is recorded as `discovery_rotation` events.
commoncrawl:
  rotation: true
  pairs_per_run: 4
  per_host: 6
  domains: []

# Public storage listings (S3/GCS XML/JSON, autoindex pages) are followed automatically
# whenever the crawler encounters them; operators may also seed known public listings here.
